[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-part-marking"
version = "0.1.0"
description = "KiCad IPC plugin for standardised QR part marking"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["kicad-python>=0.7.0"]

[tool.setuptools]
package-dir = {"" = "kicad_part_marking"}

[tool.setuptools.packages.find]
where = ["kicad_part_marking"]
